<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<meta name="description" content="Chào mừng đến với trang cá nhân Nguyễn Xuân Toàn">
<title>Nguyễn Xuân Toàn — Chào mừng</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
*{box-sizing:border-box}
html{background:#080a16}
body{margin:0;min-height:100vh;min-height:100svh;display:grid;place-items:center;padding:40px 20px;color:#f6f5fc;font-family:"Plus Jakarta Sans",system-ui,-apple-system,sans-serif;background:radial-gradient(ellipse at 28% 26%,#54259629 0%,transparent 42%),radial-gradient(ellipse at 78% 86%,#9c23541a 0%,transparent 35%),#080a16;overflow-x:hidden}
.welcome{width:100%;max-width:520px;text-align:center;animation:arrive .65s ease both}
.avatar{display:block;width:116px;height:116px;margin:0 auto 25px;border:2px solid #484056;border-radius:50%;object-fit:cover;object-position:50% 60%;box-shadow:0 14px 45px #7b32d840}
h1{margin:0;font-size:clamp(27px,7.5vw,36px);font-weight:800;line-height:1.3;letter-spacing:-1px}
.handle{margin:9px 0 37px;color:#c4b5ef;font-size:17px;letter-spacing:.2px;font-weight:600}
.entry-frame{display:inline-flex;padding:6px;border:1px solid #3b304f;border-radius:999px;box-shadow:0 18px 40px #9b32ce28}
.entry{display:inline-flex;align-items:center;justify-content:center;gap:15px;min-height:54px;min-width:205px;padding:14px 29px;border-radius:999px;background:linear-gradient(110deg,#8636e9,#d62689);color:#fff;text-decoration:none;font-size:18px;font-weight:800;transition:transform .2s,filter .2s}
.entry svg{width:22px;height:22px;flex-shrink:0}
.entry .arrow{margin-left:2px;transition:transform .2s}
.entry:hover{filter:brightness(1.1)}
.entry:hover .arrow{transform:translateX(3px)}
.entry:active{transform:scale(.98)}
.entry:focus-visible{outline:3px solid #f6ceff;outline-offset:5px}
.sound-tip{display:flex;align-items:center;justify-content:center;gap:10px;width:fit-content;max-width:100%;margin:27px auto 0;padding:10px 17px;border:1px solid #383342;border-radius:999px;background:#ffffff08;color:#aaa8bf;font-size:13px;line-height:1.6}
.sound-tip svg{width:18px;height:18px;color:#c4b5ef;flex-shrink:0}
@keyframes arrive{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

/* Lightweight welcome animations */
body{position:relative;isolation:isolate}
body::before,body::after{content:"";position:fixed;z-index:-1;pointer-events:none;width:min(90vw,650px);height:min(90vw,650px);border-radius:50%;opacity:.6;animation:ambient-drift 18s ease-in-out infinite alternate}
body::before{left:-30%;top:-8%;background:radial-gradient(circle,#7c3aed28,transparent 68%)}
body::after{right:-30%;bottom:-15%;background:radial-gradient(circle,#db277724,transparent 68%);animation-delay:-9s;animation-direction:alternate-reverse}
.welcome{position:relative;z-index:1;animation:none}
.avatar-motion{width:fit-content;margin:0 auto 25px;animation:reveal .8s ease both}
.avatar{margin:0;animation:avatar-float 5s ease-in-out .8s infinite;box-shadow:0 0 0 7px #a855f70b,0 16px 48px #7b32d844}
h1{animation:reveal .8s ease .12s both}
.handle{animation:reveal .8s ease .23s both}
.entry-frame{animation:reveal .8s ease .34s both;transition:box-shadow .25s,border-color .25s}
.entry-frame:hover{border-color:#9d63c7;box-shadow:0 16px 50px #a855f749}
.entry{position:relative;overflow:hidden;background-size:180% 180%;animation:gradient-flow 7s ease-in-out infinite;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.entry::before{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(110deg,transparent 25%,#ffffff30 50%,transparent 75%);transform:translateX(-150%);animation:button-shine 6s ease-in-out 1s infinite}
.entry>*{position:relative;z-index:1}
.entry:active{transform:scale(.96);filter:brightness(1.15)}
.sound-tip{animation:reveal .8s ease .47s both}
.sparkles{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.sparkles i{position:absolute;left:var(--x);top:var(--y);width:3px;height:3px;border-radius:50%;background:#d6bcfa;box-shadow:0 0 8px #a855f799;opacity:0;animation:sparkle-rise var(--duration) ease-in-out var(--delay) infinite}
@keyframes reveal{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
@keyframes avatar-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
@keyframes ambient-drift{from{transform:translate3d(0,0,0)}to{transform:translate3d(12%,8%,0)}}
@keyframes gradient-flow{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
@keyframes button-shine{0%,65%{transform:translateX(-150%)}85%,100%{transform:translateX(150%)}}
@keyframes sparkle-rise{0%,100%{opacity:0;transform:translateY(14px) scale(.7)}30%,65%{opacity:.5}80%{opacity:0;transform:translateY(-45px) scale(1)}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.sparkles{display:none}}

/* Font riêng cho tên Nguyễn Xuân Toàn */
@font-face{
  font-family:"SFUI Custom";
  src:url("SFUI.ttf") format("truetype");
  font-style:normal;
  font-weight:100 900;
  font-display:swap;
}
h1{font-family:"SFUI Custom",-apple-system,BlinkMacSystemFont,sans-serif!important}
</style>
